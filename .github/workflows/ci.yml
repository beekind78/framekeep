name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -c requirements-lock.txt
      - run: python scripts/check_publication.py
      - run: node --check framekeep/static/app.js
      - run: node --check framekeep/static/context.js
      - run: python -m ruff check .
      - run: python -m pytest -q
